# Deterministic geography vocabulary. Used to classify vendors into Ahmedabad / India-other / Global
# from evidence text. Extend freely - it is data, not code.

# "Ahmedabad" tier = the city and its commonly listed industrial localities.
ahmedabad:
  names: [Ahmedabad, Ahmadabad, Amdavad]
  localities: [Naroda, Odhav, Vatva, Narol, Kathwada, Rakhial, Chandkheda, Sarkhej, Changodar,
               Gomtipur, Asarwa, Shahibaug, Sola, Bapunagar, Ramol, Isanpur, Vastral, Aslali, Bavla, Sanand]
  pincode_prefixes: ["380", "382", "383"]   # supporting hint only: also covers Gandhinagar etc.

india_states: [Gujarat, Maharashtra, Rajasthan, Madhya Pradesh, Uttar Pradesh, Delhi, Haryana, Punjab, Karnataka,
               Tamil Nadu, Telangana, Andhra Pradesh, Kerala, West Bengal, Odisha, Bihar, Jharkhand, Chhattisgarh,
               Uttarakhand, Himachal Pradesh, Assam, Goa, Jammu and Kashmir]

